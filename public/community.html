<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Feed</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a class="brand" href="/">WellnessFlow</a>
        <nav class="nav" aria-label="Main navigation">
          <a href="/">Dashboard</a>
          <a href="#">Workouts</a>
          <a href="#">Nutrition</a>
          <a href="#">Community</a>
          <button class="logout-btn" id="logout-btn" type="button">Log out</button>
        </nav>
      </header>

      <main>
        <section class="community-heading">
          <div>
            <p class="eyebrow">WellnessFlow community</p>
            <h1>Community feed</h1>
            <p>Share your wellness progress and encouragement. Your post text, photos, and videos are visible to signed-in community members.</p>
          </div>
          <button class="primary-btn" id="toggle-post-form" type="button" aria-expanded="false">
            Create post
          </button>
        </section>
        <p id="feed-message" class="message" aria-live="polite"></p>

        <section class="card post-composer" id="post-composer" hidden>
          <h2 class="form-title">Create a post</h2>
          <form id="post-form" class="post-form">
            <label>
              Title
              <input type="text" id="post-title" name="title" maxlength="150" required />
            </label>
            <label>
              What would you like to share?
              <textarea id="post-contents" name="contents" rows="5" maxlength="10000" required></textarea>
            </label>
            <label>
              Add photos (up to 4, 5 MB each) or one video (up to 25 MB)
              <input
                type="file"
                id="post-media"
                name="media"
                accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm"
                multiple
              />
            </label>
            <div class="post-form-actions">
              <button class="primary-btn" id="submit-post" type="submit">Share post</button>
              <button class="secondary-btn" id="cancel-post" type="button">Cancel</button>
            </div>
          </form>
          <p id="post-message" class="message" aria-live="polite"></p>
        </section>

        <section class="post-feed" aria-label="Community posts">
          <div class="post-feed-controls">
            <label for="post-feed-filter">Show</label>
            <select id="post-feed-filter" name="feed">
              <option value="recent">Recent</option>
              <option value="mine">My posts</option>
              <option value="friends">Friends' posts</option>
              <option value="recommended">Recommended</option>
            </select>
          </div>
          <div id="post-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
